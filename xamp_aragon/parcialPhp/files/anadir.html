<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Añadir libro</title>

</head>

<body>
    <h1>Añadir libro</h1>
    <!-- 
         action="anadir.php"
         Significa:
         "Cuando pulsemos el botón, manda los datos
         al archivo anadir.php"
    -->

    <form action="anadir.php" method="POST">
        <p>Título:<input type="text" name="titulo"></p>
        <p>Autor:<input type="text" name="autor"></p>
        <p>Año:<input type="number" name="anio"></p>
        <p>Imagen:<input type="text" name="imagen"></p>
        <!--
             name="enviar"
             Será importante porque en PHP podremos hacer:
             isset($_POST["enviar"])
        -->
        <p><input type="submit" name="enviar" value="Añadir libro"></p>
    </form>


</body>

</html>
